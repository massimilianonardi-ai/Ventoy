name: Probe original GRUB map through EFI into unchanged Linux kernel

on:
  push:
    branches: [m-boot-secondary-uefi]
    paths:
      - .github/workflows/probe-linux-efi-handoff.yml
      - GRUB2/port/probe-source.c
      - GRUB2/port/probe-extents.c
      - GRUB2/port/probe-handoff.c
      - GRUB2/port/probe-standalone-module.sh
      - GRUB2/port/probe-standalone-uefi.sh
      - GRUB2/port/probe-linux-efi-consumer.c
      - GRUB2/port/build-linux-handoff-initrd.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grub-efi-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get runner-matched original GRUB source and native kernel
        shell: sh
        run: |
          set -eu
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            grub-common grub-efi-amd64-bin dpkg-dev build-essential automake autoconf \
            gettext bison flex python3 patch file busybox-static cpio dmsetup \
            gdisk dosfstools e2fsprogs mtools xorriso qemu-system-x86 ovmf \
            linux-image-generic linux-modules-extra-generic zstd kmod
          sudo DEBIAN_FRONTEND=noninteractive apt-get build-dep -y -qq grub2
          source_pkg=$(dpkg-query -W -f='${source:Package}' grub-common)
          source_ver=$(dpkg-query -W -f='${Version}' grub-common)
          mkdir -p "$RUNNER_TEMP/source-module-input"
          cd "$RUNNER_TEMP/source-module-input"
          apt-get source "$source_pkg=$source_ver"
          distro=$(find "$PWD" -mindepth 1 -maxdepth 1 -type d -name 'grub2-*' -print -quit)
          test -s "$distro/configure.ac"
          printf '%s\n' "$distro" > "$RUNNER_TEMP/source-module-path"
      - name: Build original ABI GRUB module using distro GRUB 2.12
        shell: sh
        run: |
          set -eu
          sh -n GRUB2/port/probe-standalone-module.sh
          sh -n GRUB2/port/probe-standalone-uefi.sh
          sh -n GRUB2/port/build-linux-handoff-initrd.sh
          sh GRUB2/port/probe-standalone-module.sh \
             "$(cat "$RUNNER_TEMP/source-module-path")" \
             "$RUNNER_TEMP/standalone-source-probe"
      - name: Build dedicated kernel initial RAM filesystem without altering vmlinuz
        shell: sh
        run: |
          set -eu
          sudo sh GRUB2/port/build-linux-handoff-initrd.sh "$RUNNER_TEMP/linux-handoff"
      - name: Genuine OVMF stock GRUB map to EFI runtime variable to Linux dm
        shell: sh
        run: |
          set -eu
          VTOY_LINUX_KERNEL="$RUNNER_TEMP/linux-handoff/vmlinuz" \
          VTOY_LINUX_INITRD="$RUNNER_TEMP/linux-handoff/initrd.img" \
          sh GRUB2/port/probe-standalone-uefi.sh \
            "$RUNNER_TEMP/standalone-source-probe/source/grub-core/ventoy_source_probe.mod" \
            "$RUNNER_TEMP/linux-qemu-test" ext4-gpt3 '' linux-handoff
      - name: Persist revision-specific evidence (no release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grub-efi-linux-handoff-probe
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/standalone-source-probe/autogen.log
            ${{ runner.temp }}/standalone-source-probe/configure.log
            ${{ runner.temp }}/standalone-source-probe/build.log
            ${{ runner.temp }}/standalone-source-probe/result.txt
            ${{ runner.temp }}/linux-handoff/provenance.txt
            ${{ runner.temp }}/linux-qemu-test/runtime-result.txt
            ${{ runner.temp }}/linux-qemu-test/qemu.log
            ${{ runner.temp }}/linux-qemu-test/iso-map-verification.txt
