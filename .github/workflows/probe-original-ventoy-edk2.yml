name: Build original Ventoy EDK2 EFI application (experimental)

on:
  push:
    branches: [m-boot-secondary-uefi]
    paths:
      - .github/workflows/probe-original-ventoy-edk2.yml
      - EDK2/edk2_mod/**
      - GRUB2/port/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  original-efi-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out experimental Ventoy fork
        uses: actions/checkout@v4

      - name: Install EDK2 native build requirements
        run: |
          set -eu
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential gcc g++ make uuid-dev python3 nasm acpica-tools \
            curl unzip file

      - name: Retrieve pinned original EDK2 source and apply the Ventoy overlay
        shell: bash
        run: |
          set -euo pipefail
          original=bd85bf54c268204c7a698a96f3ccd96cd77952cd
          work="$RUNNER_TEMP/ventoy-original-edk2"
          mkdir -p "$work/input"
          curl --fail --location --retry 3 \
            "https://codeload.github.com/tianocore/edk2/zip/$original" \
            -o "$work/input/edk2.zip"
          ( cd "$work/input" && sha256sum edk2.zip > "$work/source-zip.sha256" )
          unzip -q "$work/input/edk2.zip" -d "$work/input"
          src="$work/input/edk2-$original"
          test -s "$src/edksetup.sh"
          test -s "$src/MdeModulePkg/MdeModulePkg.dsc"
          test -s EDK2/edk2_mod/edk2-edk2-stable201911/MdeModulePkg/Application/Ventoy/Ventoy.c
          cp -a EDK2/edk2_mod/edk2-edk2-stable201911/. "$src/"
          test -s "$src/MdeModulePkg/Application/Ventoy/Ventoy.inf"
          # Fix one removed Python 3.12 array method in the DISPOSABLE
          # 2019 EDK2 BaseTools map verifier. Do not patch Ventoy sources.
          python3 - "$src/BaseTools/Source/Python/Common/Misc.py" <<'PY'
          import pathlib
          import sys
          
          path = pathlib.Path(sys.argv[1])
          source = path.read_text()
          old = "ByteArray.tostring() != b'PE\\0\\0'"
          new = "ByteArray.tobytes() != b'PE\\0\\0'"
          if source.count(old) != 1:
              raise SystemExit("Unexpected EDK2 source; abort Python compatibility fix")
          path.write_text(source.replace(old, new))
          PY
          {
            printf 'EDK2_SOURCE_COMMIT=%s\n' "$original"
            printf 'VENTOY_FORK_COMMIT=%s\n' "$GITHUB_SHA"
            printf 'RUNNER_IMAGE=%s\n' "$ImageOS"
            printf 'RUNNER_IMAGE_VERSION=%s\n' "$ImageVersion"
          } | tee "$work/provenance.txt"
          echo "EDK2_PATH=$src" >> "$GITHUB_ENV"

      - name: Build the original VentoyEfiMain application only
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ventoy-original-edk2"
          cd "$EDK2_PATH"
          # Legacy 2019 EDK2 host utilities assume an older compiler.
          # Relax warnings as errors ONLY for disposable BaseTools; keep
          # original Ventoy EFI C sources/build flags untouched. Surface
          # exact genuine errors, not just parallel make's last commands.
          make -C BaseTools -j 4 EXTRA_OPTFLAGS=-Wno-error \
            > "$work/basetools.log" 2>&1 || {
            grep -n -B 5 -A 7 'error:' "$work/basetools.log" | tail -n 110 >&2 || :
            tail -n 25 "$work/basetools.log" >&2
            exit 6
          }
          export WORKSPACE="$EDK2_PATH"
          # edksetup.sh from 2019 dereferences optional variables without
          # checking whether they exist, so do not source it under nounset.
          set +u
          if ! source edksetup.sh --reconfig > "$work/edksetup.log" 2>&1; then
            tail -n 80 "$work/edksetup.log" >&2
            exit 8
          fi
          set -u
          build -p MdeModulePkg/MdeModulePkg.dsc \
            -m MdeModulePkg/Application/Ventoy/Ventoy.inf \
            -a X64 -b RELEASE -t GCC5 > "$work/ventoy-build.log" 2>&1 || {
              tail -n 120 "$work/ventoy-build.log" >&2
              exit 7
            }
          actual=$(find "$EDK2_PATH/Build/MdeModule" -type f \
            -path '*/Application/Ventoy/Ventoy/OUTPUT/Ventoy.efi' -print)
          test "$(printf '%s\n' "$actual" | sed '/^$/d' | wc -l)" -eq 1
          test -s "$actual"
          file "$actual" | tee "$work/efi-file.txt"
          file "$actual" | grep -q 'PE32+.*EFI application'
          sha256sum "$actual" | tee "$work/efi-sha256.txt"
          cp "$actual" "$work/Ventoy-original-X64.EFI"
          {
            echo 'original_ventoy_edk2_build=passed'
            echo 'original_efi_entry=VentoyEfiMain'
            echo 'runtime_env_param_tested=no'
            echo 'virtual_iso_boot_tested=no'
            echo 'grub_core_patched=no'
            echo 'physical_device_writes=no'
          } | tee "$work/result.txt"

      - name: Prepare matching distro GRUB module source for real UEFI app
        shell: bash
        run: |
          set -euo pipefail
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            grub-common grub-efi-amd64-bin dpkg-dev automake autoconf \
            gettext bison flex patch gnu-efi
          sudo DEBIAN_FRONTEND=noninteractive apt-get build-dep -y grub2
          source_pkg=$(dpkg-query -W -f='${source:Package}' grub-common)
          source_ver=$(dpkg-query -W -f='${Version}' grub-common)
          mkdir -p "$RUNNER_TEMP/original-efi-module-source"
          cd "$RUNNER_TEMP/original-efi-module-source"
          apt-get source "$source_pkg=$source_ver"
          distro=$(find "$PWD" -mindepth 1 -maxdepth 1 -type d \
            -name 'grub2-*' -print -quit)
          test -s "$distro/configure.ac"
          printf '%s\n' "$distro" > "$RUNNER_TEMP/original-efi-grub-source-path"
          {
            printf 'GRUB_VERSION=%s\n' "$source_ver"
            grub-mkimage --version
          } | tee "$RUNNER_TEMP/ventoy-original-edk2/grub-version.txt"

      - name: Compile external module against unmodified distro GRUB
        shell: bash
        run: |
          set -euo pipefail
          sh GRUB2/port/probe-standalone-module.sh \
            "$(cat "$RUNNER_TEMP/original-efi-grub-source-path")" \
            "$RUNNER_TEMP/original-efi-grub-module"

      - name: Compile a genuine EFI application for the disposable El Torito ISO
        shell: bash
        run: |
          set -euo pipefail
          sh GRUB2/port/build-iso-boot-probe.sh \
            "$RUNNER_TEMP/ventoy-original-edk2/iso-efi-payload"

      - name: Boot real original Ventoy EDK2 image under disposable OVMF
        shell: bash
        run: |
          set -euo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 ovmf mtools gdisk dosfstools xorriso e2fsprogs
          module="$RUNNER_TEMP/original-efi-grub-module/source/grub-core/ventoy_source_probe.mod"
          binary="$RUNNER_TEMP/ventoy-original-edk2/Ventoy-original-X64.EFI"
          test -s "$module" && test -s "$binary"
          sh GRUB2/port/probe-standalone-uefi.sh \
            "$module" "$RUNNER_TEMP/ventoy-original-edk2/original-fat32" \
            fat32 "$binary" original
          sh GRUB2/port/probe-standalone-uefi.sh \
            "$module" "$RUNNER_TEMP/ventoy-original-edk2/original-gpt3" \
            ext4-gpt3 "$binary" original
          sh GRUB2/port/probe-standalone-uefi.sh \
            "$module" "$RUNNER_TEMP/ventoy-original-edk2/original-bad-guid" \
            fat32 "$binary" original-negative
          sh GRUB2/port/probe-standalone-uefi.sh \
            "$module" "$RUNNER_TEMP/ventoy-original-edk2/original-media-fat32" \
            fat32 "$binary" original-media
          sh GRUB2/port/probe-standalone-uefi.sh \
            "$module" "$RUNNER_TEMP/ventoy-original-edk2/original-media-gpt3" \
            ext4-gpt3 "$binary" original-media
          VTOY_ISO_BOOT_EFI="$RUNNER_TEMP/ventoy-original-edk2/iso-efi-payload/BOOTX64.EFI" \
          VTOY_ISO_DRIVER_EFI="$GITHUB_WORKSPACE/INSTALL/ventoy/iso9660_x64.efi" \
            sh GRUB2/port/probe-standalone-uefi.sh \
              "$module" "$RUNNER_TEMP/ventoy-original-edk2/original-iso-boot" \
              fat32 "$binary" original-boot
          {
            echo 'original_ventoy_edk2_runtime=passed'
            echo 'original_efi_source_scenarios=fat32-gpt1,ext4-gpt3'
            echo 'original_gpt_disk_guid_collision=resolved'
            echo 'original_wrong_gpt_guid=rejected'
            echo 'original_virtual_blockio=full_crc32_verified_and_uninstalled'
            echo 'original_efi_iso_bootloader=StartImage_probe'
            echo 'installer_boot=not-tested'
          } | tee "$RUNNER_TEMP/ventoy-original-edk2/runtime-result.txt"

      - name: Build and prove isolated external-GPT-source USB boot image
        shell: bash
        run: |
          set -euo pipefail
          bash -n GRUB2/port/prepare-usb-iso-boot-disk.sh
          bash -n GRUB2/port/run-physical-usb-uefi.sh
          bash GRUB2/port/run-physical-usb-uefi.sh --help >/dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-utils
          bundle="$RUNNER_TEMP/mboot-usb-boot"
          bash GRUB2/port/prepare-usb-iso-boot-disk.sh \
            "$RUNNER_TEMP/original-efi-grub-module/source/grub-core/ventoy_source_probe.mod" \
            "$RUNNER_TEMP/ventoy-original-edk2/Ventoy-original-X64.EFI" \
            "$GITHUB_WORKSPACE/INSTALL/ventoy/iso9660_x64.efi" \
            "$bundle" /m/boot/iso/proxmox-ve_9.2-1.iso
          ( cd "$bundle" && sha256sum -c SHA256SUMS )
          # A genuine bootable EFI ISO from the existing original Ventoy test.
          # Extend it beyond 16 MiB to exercise the separate large-ISO PVD
          # branch, without pretending this synthetic input is Proxmox.
          mkdir -p "$RUNNER_TEMP/usb-source-tree/m/boot/iso"
          cp "$RUNNER_TEMP/ventoy-original-edk2/original-iso-boot/vt-map-image.iso" \
            "$RUNNER_TEMP/usb-source-tree/m/boot/iso/proxmox-ve_9.2-1.iso"
          python3 - "$RUNNER_TEMP/usb-source-tree/m/boot/iso/proxmox-ve_9.2-1.iso" <<'PY'
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          target = 18 * 1024 * 1024
          chunk = b'VTOY-PAD' * 131072
          with path.open("ab") as stream:
              while stream.tell() < target:
                  stream.write(chunk[:min(len(chunk), target-stream.tell())])
          assert path.stat().st_size == target
          PY
          usb="$RUNNER_TEMP/usb-source-gpt.raw"
          part="$RUNNER_TEMP/usb-source-ext4.img"
          truncate -s 160M "$usb"
          sgdisk --clear --new=1:2048:+8M --typecode=1:ef00 \
            --new=2:0:+8M --typecode=2:ef00 \
            --new=3:0:+96M --typecode=3:8300 "$usb" > "$bundle/usb-gpt.log"
          sgdisk --verify "$usb" >> "$bundle/usb-gpt.log"
          first=$(sgdisk --info=3 "$usb" | awk '/First sector:/{print $3}')
          last=$(sgdisk --info=3 "$usb" | awk '/Last sector:/{print $3}')
          test "$first" -ge 2048 && test "$last" -gt "$first"
          bytes=$(( (last-first+1) * 512 ))
          truncate -s "$bytes" "$part"
          mkfs.ext4 -F -q "$part"
          # Test the actual filesystem-copy allocation path. The
          # mke2fs -d population can create sparse holes in ISO payloads.
          mkdir -p "$bundle/iso-mounted"
          sudo mount -t ext4 -o loop "$part" "$bundle/iso-mounted"
          sudo mkdir -p "$bundle/iso-mounted/m/boot/iso"
          sudo cp --sparse=never --reflink=never \
            "$RUNNER_TEMP/usb-source-tree/m/boot/iso/proxmox-ve_9.2-1.iso" \
            "$bundle/iso-mounted/m/boot/iso/proxmox-ve_9.2-1.iso"
          sudo sync
          sudo umount "$bundle/iso-mounted"
          dd if="$part" of="$usb" bs=512 seek="$first" conv=notrunc status=none
          sgdisk --verify "$usb" >> "$bundle/usb-gpt.log"
          before=$(sha256sum "$usb" | awk '{print $1}')
          qemu-img create -f qcow2 -F raw -b "$usb" "$bundle/usb-overlay.qcow2"
          qemu-img info "$bundle/usb-overlay.qcow2" | grep -F "backing file: $usb"
          ovmf_code=/usr/share/OVMF/OVMF_CODE_4M.fd
          ovmf_vars=/usr/share/OVMF/OVMF_VARS_4M.fd
          test -s "$ovmf_code" && test -s "$ovmf_vars"
          cp "$ovmf_vars" "$bundle/test-vars.fd"
          set +e
          timeout --signal=INT 120s qemu-system-x86_64 \
            -machine q35 -accel tcg -m 1024 -smp 2 \
            -drive "if=pflash,format=raw,readonly=on,file=$ovmf_code" \
            -drive "if=pflash,format=raw,file=$bundle/test-vars.fd" \
            -drive "if=none,id=boot,format=raw,file=$bundle/boot-disk.raw" \
            -device virtio-blk-pci,drive=boot,bootindex=1 \
            -drive "if=none,id=source,format=qcow2,file=$bundle/usb-overlay.qcow2" \
            -device virtio-blk-pci,drive=source,bootindex=2 \
            -display none -monitor none -serial file:"$bundle/qemu-usb.log" \
            -snapshot -no-reboot
          rc=$?
          set -e
          after=$(sha256sum "$usb" | awk '{print $1}')
          test "$before" = "$after" || { echo "source disk changed"; exit 42; }
          if { test "$rc" -ne 0 && test "$rc" -ne 124; } ||
             ! grep -Fq 'VT_ORIGINAL_ISO_EFI_STARTIMAGE_EXECUTED' "$bundle/qemu-usb.log" ||
             ! grep -Fq 'VT_USB_SOURCE_STATUS=selected' "$bundle/qemu-usb.log" ||
             ! grep -Fq 'VT_USB_PVD_STATUS=verified' "$bundle/qemu-usb.log" ||
             ! grep -Fq 'VT_USB_BOOT_STATUS=returned' "$bundle/qemu-usb.log" ||
             ! grep -Fq 'VT_USB_TEARDOWN_STATUS=yes' "$bundle/qemu-usb.log"
          then
            tail -n 125 "$bundle/qemu-usb.log"
            exit 41
          fi
          printf 'synthetic_ext4_gpt_source_efi_startimage=passed\n' \
            | tee "$bundle/test-result.txt"
          printf 'proxmox_actual_installer=not-tested\n' >> "$bundle/test-result.txt"
          printf 'build_source_revision=%s\n' "$GITHUB_SHA" >> "$bundle/BUILD-INFO.txt"

      - name: Publish verified boot-only image on experimental branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          # Reconcile benign concurrent documentation commits forward-only.
          # Never publish binaries built from stale sources if executable
          # sources, runtime or this workflow changed after this run began.
          git fetch origin m-boot-secondary-uefi
          if git diff --name-only "$GITHUB_SHA" FETCH_HEAD |
             grep -E '^(GRUB2/port/|EDK2/edk2_mod/|INSTALL/ventoy/|\.github/workflows/probe-original-ventoy-edk2.yml)'
          then
            echo 'Executable/test sources changed; new CI build required'
            exit 39
          fi
          git checkout -B publish-usb FETCH_HEAD
          src="$RUNNER_TEMP/mboot-usb-boot"
          path=GRUB2/dist/secondary-usb-uefi
          mkdir -p "$path"
          cp "$src/boot-disk.raw.gz" "$src/BUILD-INFO.txt" \
             "$src/test-result.txt" "$path/"
          grep -F '  boot-disk.raw.gz' "$src/SHA256SUMS" > "$path/SHA256SUMS"
          grep -F '  boot-disk.raw' "$src/SHA256SUMS" \
            | grep -v -F '  boot-disk.raw.gz' > "$path/RAW-SHA256SUMS"
          ( cd "$path" && sha256sum -c SHA256SUMS )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          git diff --cached --exit-code && exit 0 || :
          git commit -m "Publish tested experimental x86 UEFI USB-source boot disk"
          # This is an ordinary fast-forward push. Concurrent updates cause
          # failure rather than history rewrites or force updates.
          git push origin HEAD:refs/heads/m-boot-secondary-uefi

      - name: Upload standalone USB-source boot image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-uefi-usb-source-boot
          path: |
            GRUB2/dist/secondary-usb-uefi/boot-disk.raw.gz
            GRUB2/dist/secondary-usb-uefi/SHA256SUMS
            GRUB2/dist/secondary-usb-uefi/RAW-SHA256SUMS
            GRUB2/dist/secondary-usb-uefi/BUILD-INFO.txt
            GRUB2/dist/secondary-usb-uefi/test-result.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Upload build diagnostics only (not an integration release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-ventoy-edk2-build-evidence
          path: |
            ${{ runner.temp }}/ventoy-original-edk2/provenance.txt
            ${{ runner.temp }}/ventoy-original-edk2/source-zip.sha256
            ${{ runner.temp }}/ventoy-original-edk2/basetools.log
            ${{ runner.temp }}/ventoy-original-edk2/edksetup.log
            ${{ runner.temp }}/ventoy-original-edk2/ventoy-build.log
            ${{ runner.temp }}/ventoy-original-edk2/efi-file.txt
            ${{ runner.temp }}/ventoy-original-edk2/efi-sha256.txt
            ${{ runner.temp }}/ventoy-original-edk2/result.txt
            ${{ runner.temp }}/ventoy-original-edk2/Ventoy-original-X64.EFI
            ${{ runner.temp }}/ventoy-original-edk2/runtime-result.txt
            ${{ runner.temp }}/ventoy-original-edk2/grub-version.txt
            ${{ runner.temp }}/original-efi-grub-module/result.txt
            ${{ runner.temp }}/original-efi-grub-module/build.log
            ${{ runner.temp }}/ventoy-original-edk2/original-fat32/runtime-result.txt
            ${{ runner.temp }}/ventoy-original-edk2/original-fat32/qemu.log
            ${{ runner.temp }}/ventoy-original-edk2/original-fat32/iso-map-verification.txt
            ${{ runner.temp }}/ventoy-original-edk2/original-gpt3/runtime-result.txt
            ${{ runner.temp }}/ventoy-original-edk2/original-gpt3/qemu.log
            ${{ runner.temp }}/ventoy-original-edk2/original-gpt3/iso-map-verification.txt
            ${{ runner.temp }}/ventoy-original-edk2/original-bad-guid/runtime-result.txt
            ${{ runner.temp }}/ventoy-original-edk2/original-bad-guid/qemu.log
            ${{ runner.temp }}/ventoy-original-edk2/original-bad-guid/iso-map-verification.txt
            ${{ runner.temp }}/ventoy-original-edk2/original-media-fat32/runtime-result.txt
            ${{ runner.temp }}/ventoy-original-edk2/original-media-fat32/qemu.log
            ${{ runner.temp }}/ventoy-original-edk2/original-media-fat32/iso-map-verification.txt
            ${{ runner.temp }}/ventoy-original-edk2/original-media-gpt3/runtime-result.txt
            ${{ runner.temp }}/ventoy-original-edk2/original-media-gpt3/qemu.log
            ${{ runner.temp }}/ventoy-original-edk2/original-media-gpt3/iso-map-verification.txt
            ${{ runner.temp }}/ventoy-original-edk2/iso-efi-payload/efi-file.txt
            ${{ runner.temp }}/ventoy-original-edk2/iso-efi-payload/build.log
            ${{ runner.temp }}/ventoy-original-edk2/iso-efi-payload/efi-sha256.txt
            ${{ runner.temp }}/ventoy-original-edk2/original-iso-boot/runtime-result.txt
            ${{ runner.temp }}/ventoy-original-edk2/original-iso-boot/qemu.log
            ${{ runner.temp }}/ventoy-original-edk2/original-iso-boot/xorriso.log
            ${{ runner.temp }}/ventoy-original-edk2/original-iso-boot/boot-catalog-verification.txt
            ${{ runner.temp }}/ventoy-original-edk2/original-iso-boot/iso-map-verification.txt
          retention-days: 14
          if-no-files-found: warn
